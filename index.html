<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wellgrow Venue</title>

<style>

body{
    margin:0;
    background:#000;
    font-family:Arial,sans-serif;
}

img{
    width:100%;
    display:block;
}

/* Floating Wellgrow Logo */

.wellgrow-logo{
    position:fixed;
    right:18px;
    bottom:18px;
    width:50px;
    height:50px;
    border-radius:50%;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
    z-index:999;
    transition:.25s ease;
}

.wellgrow-logo:hover{
    transform:scale(1.06);
}

.wellgrow-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

<body>

<img src="1.png" alt="">
<img src="2.png" alt="">
<img src="3.png" alt="">

<img src="14.png" alt="">

   target="_blank"

    <img src="logo.png" alt="Wellgrow">

</a>

</body>
</html>
