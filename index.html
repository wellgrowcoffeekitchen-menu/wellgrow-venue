<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Wellgrow Venue</title>

<style>

body{
    margin:0;
    background:#000;
    font-family:Arial,sans-serif;
}

img{
    width:100%;
    display:block;
}

/* =========================
   TOMBOL RESTAURANT
========================= */

.restaurant-btn{
    position:fixed;
    right:22px;
    bottom:80px;

    width:42px;
    height:42px;

    border-radius:50%;

    background:rgba(255,255,255,0.25);
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);

    border:1px solid rgba(255,255,255,.2);

    display:flex;
    justify-content:center;
    align-items:center;

    text-decoration:none;
    font-size:20px;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

    opacity:0;
    pointer-events:none;

    transform:translateY(15px);

    transition:.25s ease;
}

.restaurant-btn.show{
    opacity:1;
    pointer-events:auto;
    transform:translateY(0);
}

/* =========================
   LOGO WELLGROW
========================= */

.wellgrow-logo{
    position:fixed;
    right:18px;
    bottom:18px;

    width:50px;
    height:50px;

    border-radius:50%;
    overflow:hidden;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

    z-index:999;

    transition:.3s ease;
}

.wellgrow-logo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

</style>

</head>

<body>

<!-- =========================
     14 HALAMAN VENUE
========================= -->

<img src="1.png" alt="">
<img src="2.png" alt="">
<img src="3.png" alt="">
<img src="4.png" alt="">
<img src="5.png" alt="">
<img src="6.png" alt="">
<img src="7.png" alt="">
<img src="8.png" alt="">
<img src="9.png" alt="">
<img src="10.png" alt="">
<img src="11.png" alt="">
<img src="12.png" alt="">
<img src="13.png" alt="">
<img src="14.png" alt="">


<!-- =========================
     TOMBOL RESTAURANT
========================= -->

<a href="https://wellgrowcoffeekitchen-menu.github.io/wellgrow-baleendah-menu/"
   class="restaurant-btn"
   id="restaurantBtn">

    ☕

</a>


<!-- =========================
     LOGO WELLGROW
========================= -->

<a href="https://www.instagram.com/wellgrow.coffee"
   target="_blank"
   class="wellgrow-logo"
   id="wellgrowLogo">

    <img src="logo.png" alt="Wellgrow">

</a>


<script>

const logo = document.getElementById("wellgrowLogo");
const restaurantBtn = document.getElementById("restaurantBtn");

let menuOpen = false;

logo.addEventListener("click", function(e){

    e.preventDefault();

    menuOpen = !menuOpen;

    if(menuOpen){

        logo.style.transform = "rotate(45deg)";
        restaurantBtn.classList.add("show");

    }else{

        logo.style.transform = "rotate(0deg)";
        restaurantBtn.classList.remove("show");

    }

});

</script>

</body>
</html>
